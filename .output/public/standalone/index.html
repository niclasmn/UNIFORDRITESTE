<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DRI Unifor | Seu próximo capítulo é internacional</title>
    <meta
      name="description"
      content="Oportunidades e mobilidade internacional da Universidade de Fortaleza."
    />
    <meta property="og:title" content="DRI | Universidade de Fortaleza" />
    <meta
      property="og:description"
      content="Oportunidades e mobilidade internacional da Universidade de Fortaleza."
    />
    <meta property="og:type" content="website" />
    <style>
      /* =========================================================================
         1. DESIGN TOKENS & THEME VARIABLES (PUMI / UNIFOR VISUAL SYSTEM)
         ========================================================================= */
      :root {
        --font-sans: Arial, Helvetica, sans-serif;
        --background: oklch(0.975 0.008 260);
        --foreground: oklch(0.27 0.065 265);
        --card: oklch(1 0 0);
        --primary: oklch(0.5005711 0.2625788 263.367);
        --primary-foreground: oklch(1 0 0);
        --institutional: oklch(0.3345389 0.1662227 268.886);
        --secondary: oklch(0.9542716 0.0215381 265.764);
        --secondary-foreground: oklch(0.5005711 0.2625788 263.367);
        --muted: oklch(0.968 0.011 260);
        --muted-foreground: oklch(0.49 0.029 262);
        --accent: oklch(0.9471881 0.0257136 253.566);
        --accent-foreground: oklch(0.5005711 0.2625788 263.367);
        --border: oklch(0.9 0.023 260);
        --warning: oklch(0.959 0.061 85);
        --warning-foreground: oklch(0.423 0.085 75);
        --success: oklch(0.944 0.036 165);
        --success-foreground: oklch(0.388 0.07 167);
        --destructive: oklch(0.55 0.19 28);
        --destructive-foreground: oklch(1 0 0);
        --shadow: 0 8px 30px oklch(0.2 0.07 265 / 0.12);
        --radius: 8px;
      }

      .high-contrast {
        --background: oklch(0.1 0 0);
        --foreground: oklch(1 0 0);
        --card: oklch(0.16 0 0);
        --primary: oklch(0.9 0.19 100);
        --primary-foreground: oklch(0.1 0 0);
        --institutional: oklch(0.24 0 0);
        --secondary: oklch(0.24 0 0);
        --secondary-foreground: oklch(0.9 0.19 100);
        --muted: oklch(0.2 0 0);
        --muted-foreground: oklch(0.88 0 0);
        --accent: oklch(0.26 0 0);
        --accent-foreground: oklch(0.9 0.19 100);
        --border: oklch(0.6 0 0);
        --warning: oklch(0.24 0.05 85);
        --warning-foreground: oklch(0.95 0.1 90);
        --success: oklch(0.2 0.04 160);
        --success-foreground: oklch(0.9 0.08 160);
      }

      /* =========================================================================
         2. BASE & ACCESSIBILITY RESET
         ========================================================================= */
      * {
        box-sizing: border-box;
        border-color: var(--border);
        letter-spacing: 0;
      }
      html {
        scroll-behavior: smooth;
        font-size: 16px;
      }
      html[data-font="-1"] {
        font-size: 14px;
      }
      html[data-font="1"] {
        font-size: 18px;
      }
      html[data-font="2"] {
        font-size: 20px;
      }
      body {
        margin: 0;
        font-family: var(--font-sans);
        color: var(--foreground);
        background: var(--background);
        line-height: 1.45;
      }
      h1,
      h2,
      h3,
      h4,
      p,
      figure {
        margin: 0;
      }
      h1 {
        font-size: 2.5rem;
        line-height: 1.25;
        font-weight: 700;
      }
      h2 {
        font-size: 1.75rem;
        line-height: 1.3;
        font-weight: 700;
        margin-bottom: 18px;
      }
      h3 {
        font-size: 1.3rem;
        line-height: 1.35;
        font-weight: 700;
        margin-bottom: 14px;
      }
      h4 {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: 12px;
      }
      p {
        color: var(--muted-foreground);
        margin-bottom: 16px;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a,
      button,
      input,
      select,
      textarea {
        outline-offset: 4px;
      }
      button,
      a,
      select,
      input[type="checkbox"],
      input[type="radio"] {
        touch-action: manipulation;
      }
      button {
        font-family: inherit;
        white-space: normal !important;
        border: 0;
        background: transparent;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--primary);
      }
      input,
      select,
      textarea {
        font: inherit;
        color: var(--foreground);
        background: var(--muted);
        border: 1px solid transparent;
        border-radius: 7px;
        padding: 13px 14px;
        width: 100%;
        min-width: 0;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--primary);
        outline: 2px solid var(--secondary);
      }
      textarea {
        min-height: 140px;
        resize: vertical;
      }
      input[type="checkbox"],
      input[type="radio"] {
        width: 16px;
        height: 16px;
        accent-color: var(--primary);
        padding: 0;
        flex-shrink: 0;
      }
      label {
        cursor: pointer;
      }

      /* =========================================================================
         3. BUTTON PRIMITIVES & UTILITY HELPERS
         ========================================================================= */
      .btn,
      .inline-flex {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 6px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          color 0.15s ease,
          opacity 0.15s ease;
        min-height: 36px;
        padding: 8px 16px;
        text-decoration: none;
      }
      .btn:disabled {
        pointer-events: none;
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn svg {
        pointer-events: none;
        flex-shrink: 0;
      }
      .btn-default {
        background: var(--primary);
        color: var(--primary-foreground);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
      }
      .btn-default:hover {
        opacity: 0.92;
      }
      .btn-secondary {
        background: var(--secondary);
        color: var(--secondary-foreground);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
      }
      .btn-secondary:hover {
        background: var(--accent);
      }
      .btn-destructive {
        background: var(--destructive);
        color: var(--destructive-foreground);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
      }
      .btn-destructive:hover {
        opacity: 0.92;
      }
      .btn-outline {
        border: 1px solid var(--border);
        background: var(--background);
        color: var(--foreground);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
      }
      .btn-outline:hover {
        background: var(--accent);
        color: var(--accent-foreground);
      }
      .btn-ghost {
        background: transparent;
        color: inherit;
      }
      .btn-ghost:hover {
        background: var(--accent);
        color: var(--accent-foreground);
      }
      .btn-link {
        background: transparent;
        color: var(--primary);
        padding: 0;
        min-height: auto;
        justify-content: flex-start;
      }
      .btn-link:hover {
        text-decoration: underline;
      }
      .btn-sm {
        min-height: 32px;
        padding: 6px 12px;
        font-size: 0.75rem;
      }
      .btn-icon {
        width: 36px;
        height: 36px;
        padding: 0;
      }
      .justify-start {
        justify-content: flex-start;
      }
      .mt-2 {
        margin-top: 8px;
      }
      .mt-3 {
        margin-top: 12px;
      }
      .mt-4 {
        margin-top: 16px;
      }
      .mt-5 {
        margin-top: 20px;
      }
      .mt-6 {
        margin-top: 24px;
      }
      .mt-7 {
        margin-top: 28px;
      }
      .mb-3 {
        margin-bottom: 12px;
      }
      .mb-4 {
        margin-bottom: 16px;
      }
      .mb-5 {
        margin-bottom: 20px;
      }
      .mr-2 {
        margin-right: 8px;
      }
      .p-0 {
        padding: 0 !important;
      }
      .inline {
        display: inline;
      }
      .block {
        display: block;
      }
      .text-sm {
        font-size: 0.875rem;
      }
      .text-destructive {
        color: var(--destructive);
      }
      .text-muted-foreground {
        color: var(--muted-foreground);
      }
      .text-warning-foreground {
        color: var(--warning-foreground);
      }

      /* =========================================================================
         4. INSTITUTIONAL CHROME & LAYOUT
         ========================================================================= */
      .container {
        width: 88.8889%;
        max-width: 1440px;
        margin: 0 auto;
      }
      .accessibility {
        background: var(--institutional);
        color: var(--primary-foreground);
        position: sticky;
        top: 0;
        z-index: 40;
        font-size: 0.6875rem;
        min-height: 31px;
      }
      .access-inner,
      .access-actions,
      .portal-links {
        display: flex;
        align-items: center;
      }
      .access-inner {
        justify-content: space-between;
      }
      .access-actions {
        gap: 10px;
      }
      .access-actions button {
        color: inherit;
        font-size: inherit;
        padding: 0 3px;
        height: 29px;
        min-height: 29px;
        box-shadow: none;
      }
      .access-actions button:hover {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .portal-links {
        gap: 18px;
      }
      .brand-header {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .brand-inner {
        display: flex;
        align-items: center;
        gap: 30px;
        min-height: 89px;
      }
      .unifor-logo {
        width: 169px;
        height: auto;
        display: block;
      }
      .dri-brand {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .dri-brand strong {
        font-size: 1.8rem;
        line-height: 1.2;
      }
      .dri-brand span {
        font-size: 0.72rem;
      }
      .account-button {
        margin-left: auto;
        width: 151px;
        height: 38px !important;
        background: var(--card);
        color: var(--primary);
        font-size: 0.78rem !important;
      }
      .main-nav {
        background: var(--card);
      }
      .nav-inner {
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        font-size: 0.77rem;
        font-weight: 600;
      }
      .nav-inner > a {
        padding: 15px 0;
      }
      .nav-inner .active,
      .nav-inner .language {
        color: var(--primary);
      }
      .mobile-menu {
        display: none;
      }
      .main-content {
        min-height: 60vh;
        padding-bottom: 48px;
      }
      .breadcrumb {
        font-size: 0.625rem;
        font-weight: 700;
        color: var(--primary);
        padding: 30px 0 27px;
      }
      .hero {
        background: var(--institutional);
        color: var(--primary-foreground);
        border-radius: 14px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        padding: 36px;
        align-items: center;
        min-height: 393px;
      }
      .hero h1 {
        font-size: 2.65rem;
        line-height: 1.3;
        margin: 18px 0;
      }
      .hero p {
        color: inherit;
        font-size: 1rem;
        line-height: 1.4;
      }
      .eyebrow {
        font-size: 0.625rem !important;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 16px;
        line-height: 1.5;
      }
      .hero .eyebrow {
        color: inherit;
        opacity: 0.85;
      }
      .hero small {
        font-size: 0.6875rem;
        display: block;
        opacity: 0.8;
        margin-top: 15px;
      }
      .hero figure {
        min-width: 0;
      }
      .hero img {
        width: 100%;
        aspect-ratio: 1.78;
        object-fit: cover;
        border-radius: 12px;
        display: block;
      }
      .hero figcaption {
        font-size: 0.6875rem;
        opacity: 0.8;
        margin-top: 13px;
      }
      .hero button,
      .hero a[data-slot] {
        margin-top: 0;
      }
      .hero a.inline-flex {
        height: 43px;
        min-width: 248px;
        font-size: 0.8rem;
      }
      .home-section {
        margin-top: 30px;
      }
      .grid-three {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px;
      }
      .grid-two {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
      }
      .item-card {
        background: var(--card);
        border-radius: 12px;
        padding: 22px;
      }
      .item-card h3 {
        font-size: 1.3rem;
      }
      .item-card p {
        font-size: 0.8rem;
        line-height: 1.45;
      }
      .item-card .eyebrow {
        margin-bottom: 14px;
      }
      .item-card .text-link {
        font-size: 0.8rem;
      }
      .journey-card {
        min-height: 173px;
      }
      .text-link {
        color: var(--primary);
        font-weight: 600;
        font-size: 0.85rem;
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .text-link:hover {
        text-decoration: underline;
      }
      .section-heading {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        align-items: baseline;
      }
      .section-heading > .text-link {
        font-size: 0.75rem;
        flex-shrink: 0;
      }
      .deadline {
        color: var(--success-foreground) !important;
        font-size: 0.73rem !important;
        font-weight: 600;
      }
      .fine-print {
        font-size: 0.65rem;
        margin: 15px 0;
        color: var(--muted-foreground);
      }
      .feature-banner {
        padding: 28px;
        background: var(--accent);
        border-radius: 12px;
      }
      .feature-banner h2 {
        color: var(--institutional);
        font-size: 1.75rem;
      }
      .feature-banner p:not(.eyebrow) {
        font-size: 0.875rem;
      }
      .feature-banner.subtle {
        background: var(--card);
      }
      .feature-banner .inline-flex {
        min-height: 43px;
        font-size: 0.8rem;
      }
      .news-card {
        padding: 18px;
      }
      .news-card > img {
        width: 100%;
        aspect-ratio: 2.55;
        object-fit: cover;
        border-radius: 10px;
        margin-bottom: 17px;
      }
      .metrics-band {
        background: var(--institutional);
        color: var(--primary-foreground);
        padding: 28px;
        border-radius: 12px;
        margin-top: 28px;
      }
      .metrics-band .eyebrow {
        color: inherit;
        opacity: 0.85;
        margin: 24px 0;
      }
      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 20px;
      }
      .metrics-grid strong {
        font-size: 2.3rem;
      }
      .metrics-grid p {
        color: inherit;
        font-size: 0.8rem;
        margin-top: 14px;
      }
      .metrics-band small {
        font-size: 0.6rem;
        opacity: 0.85;
      }
      .inline-links {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }
      .site-footer {
        background: var(--institutional);
        color: var(--primary-foreground);
        padding: 30px 0;
      }
      .footer-inner {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
      }
      .site-footer h3 {
        font-size: 1rem;
        margin-bottom: 9px;
      }
      .site-footer p,
      .footer-links {
        font-size: 0.72rem;
        color: inherit;
      }
      .site-footer p {
        opacity: 0.85;
        margin: 0;
      }
      .footer-links > div {
        display: flex;
        gap: 16px;
        margin-bottom: 8px;
      }
      .footer-links > div + div {
        opacity: 0.8;
      }
      .demo-switcher {
        position: fixed;
        bottom: 16px;
        right: 18px;
        z-index: 45;
      }
      .demo-switcher > button {
        font-size: 0.7rem;
        box-shadow: var(--shadow);
        background: var(--card);
        height: 34px;
      }
      .profile-menu {
        position: absolute;
        bottom: 46px;
        right: 0;
        background: var(--card);
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        border-radius: 8px;
        width: 280px;
        padding: 12px;
      }
      .profile-menu > button {
        display: flex;
        justify-content: space-between;
        width: 100%;
      }
      .profile-menu small {
        display: block;
        color: var(--muted-foreground);
        font-size: 0.65rem;
        border-top: 1px solid var(--border);
        padding-top: 10px;
        margin-top: 8px;
      }
      .profile-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.65rem;
        font-weight: 700;
        color: var(--muted-foreground);
      }
      .skip-link {
        position: fixed;
        top: -100px;
        left: 10px;
        z-index: 100;
        background: var(--card);
        color: var(--primary);
        padding: 10px;
      }
      .skip-link:focus {
        top: 5px;
      }
      .intro {
        margin: 0 0 30px;
      }
      .intro h1 {
        margin: 10px 0 32px;
      }
      .intro > p {
        font-size: 1rem;
      }
      .panel {
        background: var(--card);
        padding: 26px;
        border-radius: 12px;
        margin-bottom: 18px;
      }
      .notice {
        padding: 25px;
        background: var(--accent);
        border-radius: 12px;
        margin-bottom: 18px;
        color: var(--institutional);
      }
      .notice p {
        color: inherit;
        margin-bottom: 0;
      }
      .notice h3 {
        color: inherit;
      }
      .notice.warning {
        background: var(--warning);
        color: var(--warning-foreground);
      }
      .notice.success {
        background: var(--success);
        color: var(--success-foreground);
      }
      .notice div {
        font-size: 0.9rem;
      }
      .sidebar-layout {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
        gap: 30px;
      }
      .right-sidebar-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 28px;
      }
      .sidebar-layout > *,
      .right-sidebar-layout > *,
      .grid-two > *,
      .grid-three > * {
        min-width: 0;
      }
      .sidebar-layout > aside.panel > a.text-link {
        display: flex;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 12px;
        font-size: 0.85rem;
        margin-bottom: 18px;
      }
      .field > span {
        font-weight: 600;
        font-size: 0.76rem;
      }
      .field select,
      .field input {
        min-height: 44px;
      }
      .field-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .field-grid .field {
        margin: 0;
      }
      .actions {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 20px;
      }
      .actions .inline-flex {
        min-height: 42px;
      }
      .steps {
        padding: 0;
        list-style: none;
        counter-reset: steps;
        color: var(--foreground);
        font-size: 0.9rem;
      }
      .steps li {
        counter-increment: steps;
      }
      .steps li:before {
        content: counter(steps, decimal-leading-zero) "  ";
        white-space: pre;
      }
      .dark-panel {
        background: var(--institutional);
        color: var(--primary-foreground);
      }
      .dark-panel p,
      .dark-panel .eyebrow {
        color: inherit;
      }
      .dark-panel p {
        opacity: 0.85;
      }
      .dark-panel button {
        width: 100%;
        min-height: 44px;
      }
      .dark-panel h2 {
        font-size: 1.9rem;
      }
      .dark-panel h3 {
        font-size: 1.45rem;
      }
      .full-width {
        width: 100%;
      }
      .preserve-lines {
        white-space: pre-wrap;
      }
      .tabs-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 7px 12px;
        background: var(--card);
        border-radius: 12px;
        margin: 30px 0;
      }
      .tabs-bar button {
        color: var(--muted-foreground);
      }
      .tabs-bar button[aria-selected="true"],
      .tabs-bar button[aria-pressed="true"] {
        color: var(--primary);
        font-weight: 700;
      }
      .search-row {
        display: grid;
        grid-template-columns: 1fr 206px;
        gap: 16px;
        margin-bottom: 16px;
      }
      .search-row input,
      .search-row select {
        background: var(--card);
      }
      .results-count {
        font-size: 0.75rem;
      }
      .catalog-card {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 16px;
        padding: 24px;
      }
      .catalog-card h3 {
        font-size: 1.45rem;
      }
      .catalog-card p:last-child {
        margin-bottom: 0;
      }
      .catalog-card-actions {
        display: flex;
        flex-direction: column;
        gap: 14px;
        flex-shrink: 0;
        min-width: 175px;
      }
      .compare-check {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted-foreground);
        font-size: 0.75rem;
      }
      .sidebar-nav {
        align-self: start;
        padding: 25px;
        background: var(--institutional);
        color: var(--primary-foreground);

        if (!Number.isFinite(pmg) || pmg < 0 || pmg > 10) {
          return "Informe um PMG válido entre 0 e 10.";
        }
        if (enrollment !== "Regularmente matriculado" || !["B2", "C1", "C2"].includes(proficiency)) {
          return "Atenção aos requisitos: confira matrícula e proficiência com a DRI. B2 é a referência ilustrativa desta simulação.";
        }
        return "Perfil preliminar compatível com matrícula e proficiência. A avaliação do PMG depende da nota mínima do edital, ainda sujeita à validação da DRI.";
      }

      function recommendDestinations(answers) {
        const [language, budget, culture, objective] = answers;
        const scores = DESTINATIONS.map((_, i) => {
          let score = 0;
          if (language === "Português ou espanhol" && i < 2) score += 12;
          if (language === "Francês" && i === 2) score += 15;
          if ((language === "Alemão" || language === "Inglês") && i === 3) score += 15;
          if (budget === "Até € 700") score += [6, 3, 1, 0][i] ?? 0;
          if (budget === "De € 700 a € 1.000") score += [4, 4, 2, 0][i] ?? 0;
          if (budget === "Acima de € 1.000" && i === 3) score += 2;
          if (culture === "Vida praiana" && i === 1) score += 5;
          if (culture === "Patrimônio histórico" && (i === 0 || i === 2)) score += 4;
          if (culture === "Ambiente cosmopolita" && i === 3) score += 4;
          if (culture === "Cultura urbana" && (i === 0 || i === 1)) score += 2;
          if (objective === "Pesquisa e cooperação" && (i === 2 || i === 3)) score += 5;
          if (objective === "Experiência acadêmica" && (i === 0 || i === 1)) score += 2;
          if (objective === "Vivência cultural" && (i === 1 || i === 2)) score += 3;
          if (objective === "Aperfeiçoamento de idioma" && i !== 0) score += 2;
          return { index: i, score };
        });
        return scores
          .sort((a, b) => b.score - a.score || a.index - b.index)
          .slice(0, 2)
          .map((s) => s.index);
      }

      function esc(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function loadPersistedState() {
        const base = cloneInitialState();
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed.contents) && Array.isArray(parsed.interests)) {
              return { ...base, ...parsed };
            }
          }
        } catch {
          try {
            localStorage.removeItem(STORAGE_KEY);
          } catch {
            /* Ignore unavailable storage */
          }
        }
        return base;
      }

      function savePersistedState(state) {
        try {

      /* =========================================================================
         5. HASH ROUTER & NAVIGATION
         ========================================================================= */
      function parseHash() {
        const raw = (window.location.hash || "#/").replace(/^#/, "");
        const [rawPath, rawQuery] = raw.split("?");
        const path = rawPath && rawPath.startsWith("/") ? rawPath : "/" + (rawPath || "");
        const query = Object.fromEntries(new URLSearchParams(rawQuery || ""));
        let params = {};
        let matched = path;
        if (path.startsWith("/oportunidades/")) {
          const id = decodeURIComponent(path.slice("/oportunidades/".length));
          if (id) {
            matched = "/oportunidades/:id";
            params = { id };
          }
        }
        return { path, matched, query, params };
      }

      function navigate(to) {
        const target = to.startsWith("/") ? to : "/" + to;
        const hashTarget = "#" + target;
        if (window.location.hash === hashTarget) {
          syncRouteFromHash();
        } else {
          window.location.hash = hashTarget;
        }
        window.scrollTo(0, 0);
      }

      function syncRouteFromHash() {
        const parsed = parseHash();
        const prevPath = appState.route.path;
        appState.route = parsed;
        appState.ui.mobileOpen = false;
        appState.ui.profilesOpen = false;

        if (parsed.path === "/oportunidades" && prevPath !== "/oportunidades") {
          appState.ui.catalogTab =
            parsed.query.tab === "instituicoes" ? "instituicoes" : "oportunidades";
          appState.ui.catalogGuideId = null;
          const initialFilters = {
            audience: parsed.query.audience || "Todos os públicos",
            country: parsed.query.country || "Todos os países",
            mode: "Todas",
            status: "Todas",
            date: "",
          };
          appState.ui.catalogFilters = { ...initialFilters };
          appState.ui.catalogApplied = { ...initialFilters };
        } else if (parsed.path === "/oportunidades" && parsed.query.tab === "instituicoes") {
          appState.ui.catalogTab = "instituicoes";
        }
        if (parsed.path !== "/oportunidades") {
          appState.ui.catalogGuideId = null;
        }
        if (parsed.matched === "/oportunidades/:id" && parsed.params.id !== appState.ui.detailId) {
          appState.ui.detailId = parsed.params.id;
          appState.ui.detailEnrollment = "Selecione";
          appState.ui.detailDegree = "Graduação";
          appState.ui.detailPmg = "";
          appState.ui.detailProficiency = "Selecione";
          appState.ui.detailResult = "";
          appState.ui.detailInterestModal = false;
          appState.ui.detailConsent = false;
        }
        if (parsed.path === "/gestao" && prevPath !== "/gestao") {
          appState.ui.gestaoMetricEdit = appState.store.metrics.map((m) => ({ ...m }));
        }
        const meta = ROUTE_META[parsed.matched] || {
          title: "DRI | Universidade de Fortaleza",
          description: "Oportunidades e mobilidade internacional da Universidade de Fortaleza.",
        };
        document.title = meta.title;
        render();
      }

      function degToRad(deg) {
        return (deg * Math.PI) / 180;
      }

      function projectOrtho(lat, lng, centerLat, centerLng, cx, cy, radius) {
        const phi = degToRad(lat);
        const lambda = degToRad(lng);
        const phi0 = degToRad(centerLat);
        const lambda0 = degToRad(centerLng);
        const dLambda = lambda - lambda0;
        const cosC =
          Math.sin(phi0) * Math.sin(phi) + Math.cos(phi0) * Math.cos(phi) * Math.cos(dLambda);
        const x = cx + radius * Math.cos(phi) * Math.sin(dLambda);
        const y =
          cy -
          radius *
            (Math.cos(phi0) * Math.sin(phi) - Math.sin(phi0) * Math.cos(phi) * Math.cos(dLambda));
        return { x, y, visible: cosC >= 0, cosC };
      }

      function getFilteredCatalogData() {
        const ui = appState.ui;
        const applied = ui.catalogApplied;
        const q = ui.catalogQuery.toLocaleLowerCase();

        const visibleOpportunities = OPPORTUNITIES.filter(
          (o) =>
            (applied.country === "Todos os países" || o.country === applied.country) &&
            (applied.audience === "Todos os públicos" || o.audience === applied.audience) &&
            (applied.mode === "Todas" || o.mode === applied.mode) &&
            (applied.status === "Todas" || o.status === applied.status) &&
            (!applied.date || (!!o.date && o.date <= applied.date)) &&
            `${o.title} ${o.country} ${o.city} ${o.institution}`.toLocaleLowerCase().includes(q),
        ).sort((a, b) =>
          ui.catalogSort === "Ordem alfabética"
            ? a.title.localeCompare(b.title)
            : (a.date || "9999").localeCompare(b.date || "9999"),
        );

        const visibleInstitutions = PARTNER_INSTITUTIONS.filter(
          (inst) =>
            (applied.country === "Todos os países" || inst.country === applied.country) &&
            (applied.audience === "Todos os públicos" || inst.audience === applied.audience) &&
            (applied.mode === "Todas" || inst.mode === applied.mode) &&
            `${inst.name} ${inst.city} ${inst.country} ${inst.areas} ${inst.languages}`
              .toLocaleLowerCase()
              .includes(q),
        ).sort((a, b) =>
          ui.catalogSort === "Ordem alfabética"
            ? a.name.localeCompare(b.name)
            : a.country.localeCompare(b.country),
        );

        const globeInstitutions = visibleInstitutions.length
          ? visibleInstitutions
          : PARTNER_INSTITUTIONS;
        const selectedGlobeInst =
          globeInstitutions.find((i) => i.id === ui.globeSelectedId) ?? globeInstitutions[0];

        return {
          visibleOpportunities,
          visibleInstitutions,
          globeInstitutions,
          selectedGlobeInst,
        };
      }

      function drawStandaloneGlobe() {
        const canvas = document.getElementById("dri-globe-canvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        const { globeInstitutions, selectedGlobeInst } = getFilteredCatalogData();
        const rot = appState.ui.globeRot;
        const zoom = appState.ui.globeZoom;

        const dpr = window.devicePixelRatio || 1;
        const width = canvas.clientWidth || 560;
        const height = canvas.clientHeight || 410;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const cx = width / 2;
        const cy = height / 2;
        const baseRadius = Math.min(width, height) * 0.43 * zoom;

        ctx.clearRect(0, 0, width, height);

        const atmo = ctx.createRadialGradient(
          cx - baseRadius * 0.25,
          cy - baseRadius * 0.25,
          baseRadius * 0.4,
          cx,
          cy,
          baseRadius * 1.12,
        );
        atmo.addColorStop(0, "rgba(37, 99, 235, 0.08)");
        atmo.addColorStop(0.85, "rgba(29, 78, 216, 0.14)");
        atmo.addColorStop(1, "rgba(29, 78, 216, 0)");
        ctx.fillStyle = atmo;
        ctx.beginPath();
        ctx.arc(cx, cy, baseRadius * 1.12, 0, Math.PI * 2);
        ctx.fill();

        const ocean = ctx.createRadialGradient(
          cx - baseRadius * 0.3,
          cy - baseRadius * 0.3,
          baseRadius * 0.12,
          cx,
          cy,
          baseRadius,
        );
        ocean.addColorStop(0, "#eff6ff");
        ocean.addColorStop(0.55, "#dbeafe");
        ocean.addColorStop(1, "#bfdbfe");

        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, baseRadius, 0, Math.PI * 2);
        ctx.fillStyle = ocean;
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "#93c5fd";
        ctx.stroke();
        ctx.clip();

        ctx.strokeStyle = "rgba(30, 64, 175, 0.11)";
        ctx.lineWidth = 0.8;
        for (let lat = -60; lat <= 60; lat += 30) {
          ctx.beginPath();
          let started = false;
          for (let lng = -180; lng <= 180; lng += 5) {
            const p = projectOrtho(lat, lng, rot.lat, rot.lng, cx, cy, baseRadius);
            if (p.visible) {
              if (!started) {
                ctx.moveTo(p.x, p.y);
                started = true;
              } else {
                ctx.lineTo(p.x, p.y);
              }
            } else {
              started = false;
            }
          }
          ctx.stroke();
        }
        for (let lng = -180; lng < 180; lng += 30) {
          ctx.beginPath();
          let started = false;
          for (let lat = -85; lat <= 85; lat += 5) {
            const p = projectOrtho(lat, lng, rot.lat, rot.lng, cx, cy, baseRadius);
            if (p.visible) {
              if (!started) {
                ctx.moveTo(p.x, p.y);
                started = true;
              } else {
                ctx.lineTo(p.x, p.y);
              }
            } else {
              started = false;
            }
          }
          ctx.stroke();
        }

        ctx.fillStyle = "#f8fafc";
        ctx.strokeStyle = "#94a3b8";
        ctx.lineWidth = 1;
        for (const poly of LANDMASSES) {
          const projected = poly.map(([lng, lat]) =>
            projectOrtho(lat, lng, rot.lat, rot.lng, cx, cy, baseRadius),
          );
          if (!projected.some((p) => p.cosC > -0.15)) continue;
          ctx.beginPath();
          projected.forEach((p, idx) => {
            if (p.cosC < 0) {
              const dx = p.x - cx;
              const dy = p.y - cy;
              const len = Math.hypot(dx, dy) || 1;
              const hx = cx + (dx / len) * baseRadius;
              const hy = cy + (dy / len) * baseRadius;
              if (idx === 0) ctx.moveTo(hx, hy);
              else ctx.lineTo(hx, hy);
            } else {
              if (idx === 0) ctx.moveTo(p.x, p.y);
              else ctx.lineTo(p.x, p.y);
            }
          });
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }

        const originProj = projectOrtho(
          UNIFOR_ORIGIN.lat,
          UNIFOR_ORIGIN.lng,
          rot.lat,
          rot.lng,
          cx,
          cy,
          baseRadius,
        );
        if (selectedGlobeInst) {
          const targetProj = projectOrtho(
            selectedGlobeInst.lat,
            selectedGlobeInst.lng,
            rot.lat,
            rot.lng,
            cx,
            cy,
            baseRadius,
          );
          if (originProj.visible && targetProj.visible) {
            ctx.save();
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = "rgba(37, 99, 235, 0.55)";
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(originProj.x, originProj.y);
            const mx = (originProj.x + targetProj.x) / 2;
            const my = (originProj.y + targetProj.y) / 2 - 22;
            ctx.quadraticCurveTo(mx, my, targetProj.x, targetProj.y);
            ctx.stroke();
            ctx.restore();
          }
        }

        if (originProj.visible) {
          ctx.beginPath();
          ctx.arc(originProj.x, originProj.y, 4.5, 0, Math.PI * 2);
          ctx.fillStyle = "#0f172a";
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = "#ffffff";
          ctx.stroke();
          ctx.font = "600 10px Arial, Helvetica, sans-serif";
          ctx.fillStyle = "#0f172a";
          ctx.fillText("Unifor · Fortaleza", originProj.x + 8, originProj.y + 3);
        }

        for (const inst of globeInstitutions) {
          const p = projectOrtho(inst.lat, inst.lng, rot.lat, rot.lng, cx, cy, baseRadius);
          if (!p.visible) continue;
          const isSelected = selectedGlobeInst && selectedGlobeInst.id === inst.id;

          ctx.beginPath();
          ctx.arc(p.x, p.y, isSelected ? 13 : 9, 0, Math.PI * 2);
          ctx.fillStyle = isSelected ? "rgba(37, 99, 235, 0.25)" : "rgba(37, 99, 235, 0.16)";
          ctx.fill();

          ctx.beginPath();
          ctx.arc(p.x, p.y, isSelected ? 7 : 5.5, 0, Math.PI * 2);
          ctx.fillStyle = isSelected ? "#1d4ed8" : "#2563eb";
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = "#ffffff";
          ctx.stroke();

          ctx.font = isSelected
            ? "700 11px Arial, Helvetica, sans-serif"
            : "600 10px Arial, Helvetica, sans-serif";
          ctx.fillStyle = "#1e3a8a";
          ctx.fillText(inst.city, p.x + 10, p.y + 4);
        }

        ctx.restore();
      }

                  </div>

                    <span>${esc(inst.agreementType)}</span>
                  </div>
                  <div>
                    <strong>Idiomas de ensino</strong>
                    <span>${esc(inst.languages)}</span>
                  </div>
                  <div>
                    <strong>Áreas acadêmicas</strong>
                    <span>${esc(inst.areas)}</span>
                  </div>

                  title: "Moradia e custo de vida",

                ${renderNotice({
                  tone: "warning",
                  title: "Documentação e visto",
                  body: `<p>${esc(inst.documentationNote)}</p>`,
                })}
                <div class="actions">
                  ${inst.opportunityId ? renderGo(`/oportunidades/${inst.opportunityId}`, "Ver oportunidade vinculada") : ""}

                </div>
                <p class="eyebrow">MINHA DRI · SESSÃO ILUSTRATIVA</p>
                <h3>${esc(o.title)}</h3>
                ${renderNotice({
                  tone: "warning",
                  title: "Interesse não é candidatura",
                  body: "<p>Este protocolo não reserva vaga e não substitui sua inscrição oficial.</p>",

                </div>
              </div>
            </div>
          `;

          return `

              <div class="modal" role="dialog" aria-modal="true" aria-labelledby="cancel-title" data-modal-dialog>
                <h2 id="cancel-title">Cancelar manifestação de interesse?</h2>
                <p>O protocolo será mantido com o status Cancelada. Essa ação não altera uma candidatura feita no canal oficial.</p>

                  <button class="btn btn-destructive" data-action="student-confirm-cancel">Confirmar cancelamento</button>
                  <button class="btn btn-secondary" data-action="modal-close">Manter interesse</button>
                </div>
              </div>
            </div>

        }

        if (ui.gestaoEditor && appState.route.path === "/gestao") {
          const ed = ui.gestaoEditor;
          const isReview = ed.status === "Aguardando Marketing";

            ed.body.trim() &&
            ed.status !== "Publicado" &&
            (ed.language !== "PT / EN" || ed.english.trim());
          return `

                        title: "Comentário do Marketing",

                        body: "<p>A versão pública será mantida. Ao salvar, uma nova revisão será criada como rascunho.</p>",

                    <span>Título do conteúdo</span>
                    <input required value="${esc(ed.title)}" ${isReview ? "readonly" : ""} data-editor-field="title" />
                  </label>
                  <label class="field">
                    <span>Conteúdo</span>
                    <textarea aria-label="Conteúdo" required ${isReview ? "readonly" : ""} data-editor-field="body">${esc(ed.body)}</textarea>
                  </label>
                  ${renderSelectField({
                    label: "Idiomas vinculados",
                    value: ed.language,
                    options: ["PT", "PT / EN"],
                    dataAttr: `data-editor-field="language" ${isReview ? "disabled" : ""}`,
                  })}
                  ${
                    ed.language === "PT / EN"
                      ? `
                    <label class="field">
                      <span>Versão essencial em inglês</span>
                      <textarea ${isReview ? "readonly" : ""} data-editor-field="english">${esc(ed.english)}</textarea>
                    </label>
                  `
                      : ""
                  }
                  <div class="actions">
                    ${
                      !isReview
                        ? `
                      <button type="submit" class="btn btn-secondary">Salvar rascunho</button>
                      <button id="gestao-send-review-btn" type="button" class="btn btn-default" ${!canSend ? "disabled" : ""} data-action="gestao-submit-review">
                        Enviar rascunho para revisão
                      </button>
                    `
                        : renderGo("/marketing", "Abrir revisão no Marketing")
                    }
                  </div>
                </form>
              </div>
            </div>
          `;
        }
        return "";
      }

      function renderRouteContent() {
        const { matched, params } = appState.route;
        switch (matched) {
          case "/":
            return renderHomePage();
          case "/oportunidades":
            return renderCatalogPage();
          case "/oportunidades/:id":
            return renderDetailPage(params.id);
          case "/quiz":
            return renderQuizPage();
          case "/comparador":
            return renderComparisonPage();
          case "/guias":
            return renderOutboundPage();
          case "/arrival-guide":
            return renderArrivalPage();
          case "/docentes":
            return renderFacultyPage();
          case "/minha-dri":
            return renderStudentPage();
          case "/gestao":
            return renderManagementPage();
          case "/marketing":
            return renderMarketingPage();
          case "/sobre":
            return renderAboutPage();
          case "/contatos":
            return renderContactPage();
          case "/privacidade":
            return renderPrivacyPage();
          case "/acessibilidade":
            return renderAccessibilityPage();
          default:
            return renderNotFoundPage();
        }
      }

          </div>
          ${modalHtml}
        `;

        const dialog = rootEl.querySelector("[data-modal-dialog]");
        if (dialog) {
          document.body.style.overflow = "hidden";
          if (!modalHadFocusInitialized) {
            modalHadFocusInitialized = true;
            const firstFocusable = getFocusables(dialog)[0];
            if (firstFocusable) firstFocusable.focus();
          }
        } else {
          document.body.style.overflow = "";
          if (modalHadFocusInitialized) {
            modalHadFocusInitialized = false;
            if (activeModalPrevFocus && typeof activeModalPrevFocus.focus === "function") {
              activeModalPrevFocus.focus();
            }
            activeModalPrevFocus = null;
          }
        }
        drawStandaloneGlobe();
      }

      function getFocusables(container) {
        return Array.from(
          container.querySelectorAll(
            'button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]',
          ),
        );
      }

      function openModalWithFocus(setter) {
        activeModalPrevFocus = document.activeElement;
        modalHadFocusInitialized = false;
        setter();
        render();
      }

      function closeAllModals() {
        appState.ui.catalogGuideId = null;
        appState.ui.detailInterestModal = false;
        appState.ui.studentCancelId = null;
        appState.ui.gestaoEditor = null;
        render();
      }

      /* =========================================================================
         9. CENTRALIZED EVENT DELEGATION
         ========================================================================= */
      document.addEventListener("keydown", (e) => {
        const dialog = document.querySelector("[data-modal-dialog]");
        if (!dialog) return;
        if (e.key === "Escape") {
          e.preventDefault();
          closeAllModals();
          return;
        }
        if (e.key === "Tab") {
          const focusables = getFocusables(dialog);
          if (!focusables.length) return;
          const first = focusables[0];
          const last = focusables[focusables.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      });

      document.addEventListener("mousedown", (e) => {
        if (e.target && e.target.dataset && e.target.dataset.action === "modal-backdrop") {
          closeAllModals();
        }
      });

      document.addEventListener("click", (e) => {
        const scrollEl = e.target.closest("[data-scroll-target]");
        if (scrollEl) {
          const targetEl = document.getElementById(scrollEl.dataset.scrollTarget);
          if (targetEl) targetEl.scrollIntoView();
          return;
        }

        const btn = e.target.closest("[data-action]");
        if (!btn) return;
        const action = btn.dataset.action;
        const ui = appState.ui;

        switch (action) {
          case "font-dec":
            ui.font = Math.max(-1, ui.font - 1);
            render();
            break;
          case "font-reset":
            ui.font = 0;
            render();
            break;
          case "font-inc":
            ui.font = Math.min(2, ui.font + 1);
            render();
            break;
          case "toggle-contrast":
            ui.contrast = !ui.contrast;
            render();
            break;
          case "toggle-mobile":
            ui.mobileOpen = !ui.mobileOpen;
            render();
            break;
          case "toggle-profiles":
            ui.profilesOpen = !ui.profilesOpen;
            render();
            break;
          case "switch-profile":
            ui.profilesOpen = false;
            navigate(btn.dataset.to || "/");
            break;
          case "modal-close":
            closeAllModals();
            break;
          case "catalog-tab":
            ui.catalogTab = btn.dataset.tab;
            render();
            break;
          case "catalog-view":
            ui.catalogView = btn.dataset.view;
            render();
            break;
          case "catalog-apply":
            ui.catalogApplied = { ...ui.catalogFilters };
            render();
            break;
          case "catalog-clear":
            ui.catalogFilters = {
              audience: "Todos os públicos",
              country: "Todos os países",
              mode: "Todas",
              status: "Todas",
              date: "",
            };
            ui.catalogApplied = { ...ui.catalogFilters };
            ui.catalogQuery = "";
            render();
            break;
          case "catalog-map-country":
            ui.catalogMapCountry = btn.dataset.country;
            render();
            break;
          case "globe-zoom-in":
            ui.globeZoom = Math.min(1.45, +(ui.globeZoom + 0.15).toFixed(2));
            drawStandaloneGlobe();
            break;
          case "globe-zoom-out":
            ui.globeZoom = Math.max(0.85, +(ui.globeZoom - 0.15).toFixed(2));
            drawStandaloneGlobe();
            break;
          case "globe-reset":
            ui.globeZoom = 1;
            ui.globeRot = { lat: 24, lng: -18 };
            drawStandaloneGlobe();
            break;
          case "globe-focus": {
            const inst = PARTNER_INSTITUTIONS.find((i) => i.id === btn.dataset.instId);
            if (inst) {
              ui.globeSelectedId = inst.id;
              ui.globeRot = {
                lat: Math.min(58, Math.max(-45, inst.lat - 6)),
                lng: inst.lng,
              };
              render();
            }
            break;
          }
          case "open-institution-guide":
            openModalWithFocus(() => {
              ui.catalogGuideId = btn.dataset.instId || null;
            });
            break;
          case "detail-open-interest":
            openModalWithFocus(() => {
              ui.detailInterestModal = true;
            });
            break;
          case "detail-register": {
            const o = OPPORTUNITIES.find((x) => x.id === appState.route.params.id);
            if (!o || !ui.detailConsent) return;
            updateStore((s) => {
              const found = s.interests.find(
                (i) => i.title === o.title && i.status !== "Cancelada",
              );
              if (found) return s;
              return {
                ...s,
                interests: [
                  ...s.interests,
                  {
                    id: `DRI-2026-${String(s.interests.length + 1).padStart(4, "0")}`,
                    title: o.title,
                    status: "Recebida",
                    note: "",
                  },
                ],
              };
            });
            ui.detailInterestModal = false;
            navigate("/minha-dri");
            break;
          }
          case "quiz-prev":
            if (ui.quizStep > 0) {
              ui.quizStep -= 1;
              render();
            }
            break;
          case "quiz-next":
            if (!appState.store.answers[ui.quizStep]) return;
            if (ui.quizStep === 3) {
              updateStore((s) => ({ ...s, selected: [] }));
              navigate("/comparador");
            } else {
              ui.quizStep += 1;
              render();
            }
            break;
          case "quiz-reset":
            updateStore((s) => ({ ...s, answers: [], selected: [] }));
            ui.quizStep = 0;
            navigate("/quiz");
            break;
          case "arrival-toggle-courses":
            ui.arrivalShowCourses = !ui.arrivalShowCourses;
            render();
            break;
          case "arrival-living":
            ui.arrivalLiving = ui.arrivalLiving === btn.dataset.living ? "" : btn.dataset.living;
            render();
            break;
          case "student-section":
            ui.studentSection = btn.dataset.section;
            render();
            break;
          case "student-open-cancel":
            openModalWithFocus(() => {
              ui.studentCancelId = btn.dataset.id;
            });
            break;
          case "student-confirm-cancel": {
            const cancelId = ui.studentCancelId;
            updateStore((s) => ({
              ...s,
              interests: s.interests.map((i) =>
                i.id === cancelId ? { ...i, status: "Cancelada" } : i,
              ),
            }));
            ui.studentCancelId = null;
            render();
            break;
          }
          case "gestao-section":
            ui.gestaoSection = btn.dataset.section;
            ui.gestaoNotice = "";
            if (ui.gestaoSection === "Indicadores agregados") {
              ui.gestaoMetricEdit = appState.store.metrics.map((m) => ({ ...m }));
            }
            render();
            break;
          case "gestao-clear-notice":
            ui.gestaoNotice = "";
            render();
            break;
          case "gestao-new-draft":
            openModalWithFocus(() => {
              ui.gestaoEditor = {
                id: `draft-${Date.now()}`,
                title: "",
                body: "",
                english: "",
                language: "PT",
                status: "Rascunho",
                comment: "",
              };
            });
            break;
          case "gestao-edit": {
            const target = appState.store.contents.find((c) => c.id === btn.dataset.id);
            if (target) {
              openModalWithFocus(() => {
                ui.gestaoEditor = { ...target };
              });
            }
            break;
          }
          case "gestao-quick-send": {
            const draft = appState.store.contents.find(
              (c) => c.status === "Rascunho" || c.status === "Ajustes solicitados",
            );
            openModalWithFocus(() => {
              ui.gestaoEditor = draft
                ? { ...draft }
                : {
                    id: `draft-${Date.now()}`,
                    title: "",
                    body: "",
                    english: "",
                    language: "PT",
                    status: "Rascunho",
                    comment: "",
                  };
            });
            break;
          }
          case "gestao-submit-review":
            saveGestaoDraft("Aguardando Marketing");
            break;
          case "mkt-view":
            ui.mktView = btn.dataset.view;
            render();
            break;
          case "mkt-decide": {
            const publish = btn.dataset.publish === "true";
            const pending = appState.store.contents.filter(
              (c) => c.status === "Aguardando Marketing",
            );
            const active = pending.find((c) => c.id === ui.mktSelected) ?? pending[0];
            if (!active) return;
            if (publish && !canPublish(active.status, ui.mktChecks)) return;
            if (!publish && !ui.mktComment.trim()) {
              ui.mktError = "Descreva os ajustes necessários antes de devolver à DRI.";
              render();
              return;
            }
            updateStore((s) => {
              let next = {
                ...s,
                contents: s.contents.map((c) =>
                  c.id === active.id
                    ? {
                        ...c,
                        status: publish ? "Publicado" : "Ajustes solicitados",
                        comment: ui.mktComment,
                      }
                    : c,
                ),
              };
              if (publish && active.id.startsWith("metrics-")) {
                try {
                  const parsed = JSON.parse(active.comment);
                  if (Array.isArray(parsed) && parsed.length === 6) {
                    next = { ...next, metrics: parsed };
                  }
                } catch {
                  /* Ignore malformed metrics payload */
                }
              }
              return next;
            });
            ui.mktMessage = publish
              ? "Conteúdo aprovado e publicado no portal de demonstração."
              : "Ajustes solicitados. O comentário já está disponível para a DRI.";
            ui.mktChecks = Array(7).fill(false);
            ui.mktComment = "";
            ui.mktSelected = "";
            ui.mktError = "";
            render();
            break;
          }
        }
      });

      function saveGestaoDraft(status) {
        const ed = appState.ui.gestaoEditor;
        if (!ed || !ed.title.trim() || !ed.body.trim()) return;
        let content = { ...ed, status };
        if (ed.status === "Publicado") {
          content = { ...content, id: `revision-${Date.now()}`, status: "Rascunho" };
        }
        updateStore((s) => ({
          ...s,
          contents: s.contents.some((c) => c.id === content.id)
            ? s.contents.map((c) => (c.id === content.id ? content : c))
            : [...s.contents, content],
        }));
        appState.ui.gestaoEditor = null;
        appState.ui.gestaoNotice =
          status === "Aguardando Marketing"
            ? "Rascunho enviado para revisão do Marketing."
            : "Rascunho salvo. Nenhuma alteração foi publicada.";
        render();
      }

      document.addEventListener("input", (e) => {
        const el = e.target;
        const ui = appState.ui;

        if (el.dataset.action === "catalog-search") {
          ui.catalogQuery = el.value;
          const pos = el.selectionStart;
          render();
          const nextInput = document.getElementById("catalog-search-input");
          if (nextInput) {
            nextInput.focus();
            nextInput.setSelectionRange(pos, pos);
          }
          return;
        }
        if (el.dataset.detailField === "detailPmg") {
          ui.detailPmg = el.value;
          ui.detailResult = "";
          const pos = el.selectionStart;
          render();
          const nextInput = document.getElementById("detail-pmg-input");
          if (nextInput) {
            nextInput.focus();
            try {
              nextInput.setSelectionRange(pos, pos);
            } catch {
              /* Number inputs in some browsers do not support selectionRange */
            }
          }
          return;
        }
        if (el.dataset.gestaoInterestNote) {
          const id = el.dataset.gestaoInterestNote;
          updateStore((s) => ({
            ...s,
            interests: s.interests.map((x) => (x.id === id ? { ...x, note: el.value } : x)),
          }));
          return;
        }
        if (el.dataset.gestaoMetricIndex !== undefined) {
          const idx = Number(el.dataset.gestaoMetricIndex);
          if (!ui.gestaoMetricEdit.length) {
            ui.gestaoMetricEdit = appState.store.metrics.map((m) => ({ ...m }));
          }
          ui.gestaoMetricEdit[idx].value = Math.max(0, Number(el.value));
          return;
        }
        if (el.dataset.editorField && ui.gestaoEditor) {
          ui.gestaoEditor[el.dataset.editorField] = el.value;
          const sendBtn = document.getElementById("gestao-send-review-btn");
          if (sendBtn) {
            const ed = ui.gestaoEditor;
            sendBtn.disabled = !(
              ed.title.trim() &&
              ed.body.trim() &&
              ed.status !== "Publicado" &&
              (ed.language !== "PT / EN" || ed.english.trim())
            );
          }
          return;
        }
        if (el.dataset.action === "mkt-comment") {
          ui.mktComment = el.value;
        }
      });

      document.addEventListener("change", (e) => {
        const el = e.target;
        const ui = appState.ui;

        if (el.dataset.catalogFilter) {
          ui.catalogFilters[el.dataset.catalogFilter] = el.value;
          return;
        }
        if (el.dataset.action === "catalog-sort") {
          ui.catalogSort = el.value;
          render();
          return;
        }
        if (el.dataset.action === "catalog-compare-toggle") {
          const id = el.dataset.id;
          updateStore((s) => ({
            ...s,
            selected: el.checked
              ? s.selected.includes(id)
                ? s.selected
                : [...s.selected, id]
              : s.selected.filter((x) => x !== id),
          }));
          render();
          return;
        }
        if (el.dataset.detailField && el.dataset.detailField !== "detailPmg") {
          ui[el.dataset.detailField] = el.value;
          render();
          return;
        }
        if (el.dataset.action === "detail-consent") {
          ui.detailConsent = el.checked;
          const confirmBtn = document.getElementById("detail-confirm-btn");
          if (confirmBtn) confirmBtn.disabled = !ui.detailConsent;
          return;
        }
        if (el.dataset.action === "quiz-answer") {
          updateStore((s) => {
            const next = [...s.answers];
            next[ui.quizStep] = el.value;
            return { ...s, answers: next };
          });
          render();
          return;
        }
        if (el.dataset.arrivalFilter) {
          ui[el.dataset.arrivalFilter] = el.value;
          ui.arrivalShowCourses = true;
          render();
          return;
        }
        if (el.dataset.facultyFilter) {
          ui[el.dataset.facultyFilter] = el.value;
          render();
          return;
        }
        if (el.dataset.action === "student-select-interest") {
          ui.studentSelectedId = el.value;
          render();
          return;
        }
        if (el.dataset.gestaoInterestStatus) {
          const id = el.dataset.gestaoInterestStatus;
          updateStore((s) => ({
            ...s,
            interests: s.interests.map((x) => (x.id === id ? { ...x, status: el.value } : x)),
          }));
          return;
        }
        if (el.dataset.editorField === "language" && ui.gestaoEditor) {
          ui.gestaoEditor.language = el.value;
          render();
          return;
        }
        if (el.dataset.action === "mkt-select") {
          ui.mktSelected = el.value;
          ui.mktChecks = Array(7).fill(false);
          ui.mktComment = "";
          ui.mktError = "";
          render();
          return;
        }
        if (el.dataset.action === "mkt-check") {
          const idx = Number(el.dataset.index);
          ui.mktChecks[idx] = el.checked;
          const pending = appState.store.contents.filter(
            (c) => c.status === "Aguardando Marketing",
          );
          const active = pending.find((c) => c.id === ui.mktSelected) ?? pending[0];
          const pubBtn = document.getElementById("mkt-publish-btn");
          const hint = document.getElementById("mkt-publish-hint");
          if (pubBtn && active) pubBtn.disabled = !canPublish(active.status, ui.mktChecks);
          if (hint) {
            hint.textContent = ui.mktChecks.every(Boolean)
              ? "A aprovação publica a versão revisada no ambiente de demonstração. A DRI recebe a atualização de status."
              : "Confirme os 7 itens de conferência editorial para publicar.";
          }
        }
      });

      document.addEventListener("submit", (e) => {
        if (e.target.id === "eligibility-form") {
          e.preventDefault();
          appState.ui.detailResult = checkEligibility(
            appState.ui.detailEnrollment,
            Number(appState.ui.detailPmg),
            appState.ui.detailProficiency,
          );
          render();
          return;
        }
        if (e.target.id === "gestao-editor-form") {
          e.preventDefault();
          saveGestaoDraft("Rascunho");
          return;
        }
        if (e.target.id === "gestao-metrics-form") {
          e.preventDefault();
          const metricsPayload =
            appState.ui.gestaoMetricEdit.length === 6
              ? appState.ui.gestaoMetricEdit
              : appState.store.metrics;
          const draft = {
            id: `metrics-${Date.now()}`,
            title: "Revisão de metas institucionais agregadas",
            body: metricsPayload.map((m) => `${m.value} — ${m.label}`).join("\n"),
            english: "",
            language: "PT",
            status: "Aguardando Marketing",
            comment: JSON.stringify(metricsPayload),
          };
          updateStore((s) => ({ ...s, contents: [...s.contents, draft] }));
          appState.ui.gestaoNotice =
            "Metas enviadas para revisão. O portal ainda mantém os valores aprovados.";
          render();
        }
      });

      const globeDrag = {
        active: false,
        moved: false,
        startX: 0,
        startY: 0,
        startLat: 24,
        startLng: -18,
      };

      document.addEventListener("pointerdown", (e) => {
        const canvas = e.target && e.target.id === "dri-globe-canvas" ? e.target : null;
        if (!canvas) return;
        try {
          canvas.setPointerCapture(e.pointerId);
        } catch {
          /* Ignore pointer capture errors */
        }
        globeDrag.active = true;
        globeDrag.moved = false;
        globeDrag.startX = e.clientX;
        globeDrag.startY = e.clientY;
        globeDrag.startLat = appState.ui.globeRot.lat;
        globeDrag.startLng = appState.ui.globeRot.lng;
      });

      document.addEventListener("pointermove", (e) => {
        if (!globeDrag.active) return;
        const dx = e.clientX - globeDrag.startX;
        const dy = e.clientY - globeDrag.startY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) globeDrag.moved = true;
        appState.ui.globeRot = {
          lat: Math.min(68, Math.max(-68, globeDrag.startLat + dy * 0.35)),
          lng: globeDrag.startLng - dx * 0.45,
        };
        drawStandaloneGlobe();
      });

      document.addEventListener("pointerup", (e) => {
        if (!globeDrag.active) return;
        const wasMoved = globeDrag.moved;
        globeDrag.active = false;
        if (wasMoved) return;
        const canvas = document.getElementById("dri-globe-canvas");
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        const baseRadius = Math.min(rect.width, rect.height) * 0.43 * appState.ui.globeZoom;
        const { globeInstitutions } = getFilteredCatalogData();

        let closest = null;
        let closestDist = 18;
        for (const inst of globeInstitutions) {
          const p = projectOrtho(
            inst.lat,
            inst.lng,
            appState.ui.globeRot.lat,
            appState.ui.globeRot.lng,
            cx,
            cy,
            baseRadius,
          );
          if (!p.visible) continue;
          const d = Math.hypot(clickX - p.x, clickY - p.y);
          if (d < closestDist) {
            closestDist = d;
            closest = inst;
          }
        }
        if (closest) {
          appState.ui.globeSelectedId = closest.id;
          appState.ui.globeRot = {
            lat: Math.min(58, Math.max(-45, closest.lat - 6)),
            lng: closest.lng,
          };
          render();
        }
      });

      window.addEventListener("hashchange", syncRouteFromHash);
      if (!window.location.hash) {
        window.history.replaceState(null, "", "#/");
      }
      syncRouteFromHash();
    </script>
  </body>
</html>
